  allow_failure: true
  parallel:
    matrix:
      - SOURCE_IMAGE_NAME: typescript-services
        TARGET_IMAGE_NAME: services-platform
      - SOURCE_IMAGE_NAME: python-services
        TARGET_IMAGE_NAME: admin-webapp

##
# Exchange/Platform jobs
##
# deploy containerized app to kubernetes cluster
# using exchangectl tool
#
.deploy-api:platform:k8s:
  stage: release
  image: registry.gitlab.com/org/products/tandm/basecamp/platform/infra/exchangectl:latest
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}-${STAGE}
  id_tokens:
    PLATFORM_TOKEN:
      aud: deploy-api
  script:
    - exchangectl deploy --project "admin" --project "attachment" --project "comment"
      --project "export"  --project "testconfig" --project "workflow" --project "inventory"
      --project "measurement" --project "measurement-headless"
      --stage ${STAGE} --container_tag ${IMAGE_TAG}
      --token $PLATFORM_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

deploy:python-services:platform:qa:
  extends: .deploy-api:platform:k8s
  needs:
    - container:release:platform:ecr:qa
    - init_qa
  variables:
    STAGE: qa

deploy:python-services:platform:prod:
  extends: .deploy-api:platform:k8s
  needs:
    - container:release:platform:ecr:prod
    - init_prod
    - mongo_migrations_up_prod
  variables:
    STAGE: prod

