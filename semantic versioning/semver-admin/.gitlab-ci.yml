# Base job for HTML docs
.doc-template:
  extends:
    - .release-template
  image: public.ecr.aws/docker/library/python:3.11
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - echo -e "machine gitlab.com\nlogin gitlab-ci-token\npassword ${CI_JOB_TOKEN}" > ~/.netrc
    - pip install --extra-index-url https://gitlab.com/api/v4/projects/48897778/packages/pypi/simple -U pip setuptools -e .[doc]
  script:
    # Add timestamp to logs for debugging problem with containers dying
    - echo "UTC Timestamp"
    - date '+%Y-%m-%dT%H:%M:%S:%3NZ'
    - mv build/report/coverage/html doc/_static/embed/coverage
    - make sphinx-doc
    - mkdir public
    - mv build/sphinx/html/* public/
  artifacts:
    paths:
      - public
  needs:
    - coverage
    - openapi
    - openapi_public

# Publish the doc as an environment
doc-review:
  extends:
    - .doc-template
  variables:
    PUBLIC_URL: /-/products/tandm/basecamp/cloud/$CI_PROJECT_NAME/-/jobs/$CI_JOB_ID/artifacts/public
  environment:
    name: doc/$CI_COMMIT_REF_SLUG
    deployment_tier: development
    on_stop: stop-doc-review
    auto_stop_in: 2 week
    url: "https://org.gitlab.io/-/products/tandm/basecamp/cloud/$CI_PROJECT_NAME/-/jobs/$CI_JOB_ID/artifacts/public/apidoc/public.html, https://org.gitlab.io/-/products/tandm/basecamp/cloud/$CI_PROJECT_NAME/-/jobs/$CI_JOB_ID/artifacts/public/apidoc/redoc.html"
  resource_group: $CI_MERGE_REQUEST_IID
  rules:
    # Only on branches and never on schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: on_success

# Publish the official docs on gitlab pages.
pages:
  extends:
    - .doc-template
  environment:
    name: doc/production
    deployment_tier: production
    url: $CI_PAGES_URL
  resource_group: prod
  rules:
    # Only run after a merge on default branch
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

# Kill the doc environment from time to time
stop-doc-review:
  extends:
    - .release-template
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Remove review documentation"
  environment:
    name: doc/$CI_COMMIT_REF_SLUG
    action: stop
  rules:
    # Run either (optionally) manually on a MR pipeline or triggered by on_stop.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: manual
      allow_failure: true

