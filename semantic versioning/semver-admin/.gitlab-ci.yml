###
# -- Conventions and code analysis
#
.codeanalysis-template:
  image: public.ecr.aws/docker/library/python:3.11
  extends:
    - .test-template
  before_script:
    # Add timestamp to logs for debugging problem with containers dying
    - echo "UTC Timestamp"
    - date '+%Y-%m-%dT%H:%M:%S:%3NZ'
    - python -m venv .venv
    - source .venv/bin/activate
    - echo -e "machine gitlab.com\nlogin gitlab-ci-token\npassword ${CI_JOB_TOKEN}" > ~/.netrc
    - pip install --extra-index-url https://gitlab.com/api/v4/projects/48897778/packages/pypi/simple -U pip setuptools -e '.[code_analysis]'
      # pre-commit is needed as Make commands (like `make lint`) rely on it for consistent code quality enforcement
    - pre-commit install
  needs: []

# Look for common error and antipatterns in the code
lint:
  needs:
  extends:
    - .codeanalysis-template
  script:
    - make lint

# Enforce our python styleguide
codestyle:
  extends:
    - .codeanalysis-template
  script:
    - make codestyle

# Enforce our python import styleguide
importstyle:
  extends:
    - .codeanalysis-template
  script:
    - make import-style

# Enforce the python docstring styleguide
docstringstyle:
  extends:
    - .codeanalysis-template
  script:
    - make docstring-style

# Look for overly complex algorithms
complexity:
  extends:
    - .codeanalysis-template
  script:
    - make complexity

# Run linter in legacy folder
legacy_lint:
  stage: test
  extends:
    - .neutral-orgrunner
  script:
    - cd legacy
    - yarn install
    - yarn lint:check
  image: public.ecr.aws/docker/library/node:20
  allow_failure: false
  only:
    - merge_requests

