#
# Automatic semver release to ECR with gitlab tag creation.
# For now added here, independently of regular release stage. When new deployment strategy is implemented, will remove the old release way.
#

semantic-release:
  image: node:22
  stage: release
  variables:
    GITLAB_TOKEN: $BASECAMP_PAT
  script:
    - echo "*** Generating the releases version using semantic-release. ***"
    - cd semver
    - apt update && apt-get install git-lfs -y
    - npm install @semantic-release/gitlab @semantic-release/exec @semantic-release/git @semantic-release/changelog conventional-changelog-conventionalcommits
    - npx semantic-release
    - cp VERSION.txt ../VERSION.txt
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  artifacts:
    paths:
      - VERSION.txt

container:semver-release:platform:ecr:qa:
  stage: release
  variables:
    AWS_PROFILE: "ecr-admin"
    AWS_ROLE: "arn:aws:iam::905418345845:role/exchange-ecr-poweruser"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - mkdir -p ~/.aws
    - echo "${GITLAB_OIDC_TOKEN}" > /tmp/web_identity_token
    - echo -e "[profile ${AWS_PROFILE}]\nrole_arn=${AWS_ROLE}\nweb_identity_token_file=/tmp/web_identity_token" > ~/.aws/config
  needs:
    [
      container:build:typescript:services,
      container:build:python:services:qa,
      semantic-release,
    ]
  allow_failure: true
  parallel:
    matrix:
      - SOURCE_IMAGE_NAME: typescript-services
        TARGET_IMAGE_NAME: services-platform
      - SOURCE_IMAGE_NAME: python-services
        TARGET_IMAGE_NAME: admin-webapp
  image:
    name: registry.gitlab.com/org/products/tandm/basecamp/oci/py_terraform
  script:
    - VERSION=$(cat VERSION.txt)
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - aws ecr get-login-password --region us-east-1 --profile ecr-admin | crane auth login -u AWS --password-stdin 905418345845.dkr.ecr.us-east-1.amazonaws.com
    - SRC_NAME="${SOURCE_IMAGE_NAME:-${IMAGE_NAME}}"
    - DST_NAME="${TARGET_IMAGE_NAME:-${SRC_NAME}}"
    - crane cp $CI_REGISTRY_IMAGE/${SRC_NAME}:qa-${CI_COMMIT_SHA} 905418345845.dkr.ecr.us-east-1.amazonaws.com/exchange/${DST_NAME}:${VERSION}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
