###
# Runs Mongo DB migrations on QA
mongo_migrations_up_qa:
  extends:
    - .neutral-orgrunner
    - .qa-orgrunner
  image: public.ecr.aws/docker/library/node:20
  stage: release
  variables:
    MIGRATE_MONGO_URL: ${qa_admin_connection_string}
  parallel:
    matrix:
      - MONGO_MIGRATION_TARGET: qa-tmsWorkflow
        MONGO_MIGRATION_FOLDER: workflow
      - MONGO_MIGRATION_TARGET: qa-tmsMeasurement
        MONGO_MIGRATION_FOLDER: measurement
  script:
    - cd legacy
    - yarn migrate:up
  needs: ["build_legacy_dist"]
  rules:
    # Only run after a merge on default branch
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
###
# Runs Mongo DB migrations on PROD
mongo_migrations_up_prod:
  image: public.ecr.aws/docker/library/node:20
  stage: release
  extends:
    - .prod-orgrunner
  variables:
    MIGRATE_MONGO_URL: ${prod_admin_connection_string}
  parallel:
    matrix:
      - MONGO_MIGRATION_TARGET: prod-tmsWorkflow
        MONGO_MIGRATION_FOLDER: workflow
      - MONGO_MIGRATION_TARGET: prod-tmsMeasurement
        MONGO_MIGRATION_FOLDER: measurement
  script:
    - cd legacy
    - yarn migrate:up
  needs:
    - build_legacy_dist
    - deploy_prod
  rules:
    # Only run after a merge on default branch
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

