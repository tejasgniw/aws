.qa-postgres-variables:
  variables:
    SQL_SCHEME: postgresql+asyncpg
    SQL_USERNAME: adminservices_write
    SQL_PASSWORD: $Database_adminservices_write_QA
    SQL_HOST: $ADMIN_DB_HOST_QA
    SQL_PORT: 5432
    SQL_DBNAME: adminservices
    SQL_SCHEMA: public

.prod-postgres-variables:
  variables:
    SQL_SCHEME: postgresql+asyncpg
    SQL_USERNAME: adminservices_write
    SQL_PASSWORD: $Database_adminservices_write_Prod
    SQL_HOST: $ADMIN_DB_HOST_PROD
    SQL_PORT: 5432
    SQL_DBNAME: adminservices
    SQL_SCHEMA: public

.migration-job-template:
  extends:
    - .pypackages-template
  when: manual
  stage: janitor

# QA Jobs
migrate-postgres-database:qa:
  extends:
    - .qa-orgrunner
    - .qa-postgres-variables
    - .migration-job-template
  script:
    - make migrate-db

downgrade-latest-postgres-migration:qa:
  extends:
    - .qa-orgrunner
    - .qa-postgres-variables
    - .migration-job-template
  script:
    - make downgrade-db

# Production Jobs
migrate-postgres-database:prod:
  extends:
    - .prod-orgrunner
    - .prod-postgres-variables
    - .migration-job-template
  script:
    - make migrate-db

downgrade-latest-postgres-migration:prod:
  extends:
    - .prod-orgrunner
    - .prod-postgres-variables
    - .migration-job-template
  script:
    - make downgrade-db
