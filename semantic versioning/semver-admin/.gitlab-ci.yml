##############################################################################
# -- STAGE: test -------------------------------------------------------------
# region test
#####

###################################
# -- Important Notes --------------
#####
#
# It is important to use localhost as host when testing anything with services
# since we currently run our tests in Kubernetes (k8s).
#
# Explanation:
#
# - The kubernetes executor will create a pod runner.
# - All your containers will start in the same pod with only one IP address.
# - Network between containers in the same pod is done by contacting 127.0.0.1.
# - If you want to contact the postgres container you'll likely want to contact
#   127.0.0.1:5432.
# - So if you use 127.0.0.1 instead of postgres it should work.
#
# The docker executor work pretty much like a docker-compose upping all your
# containers in the same network. Each container get an IP and a DNS is
# created:
#
#   If your service is named postgres the command nc postgres will resolve the
#   postgres container IP and contact it (172.17.0.15:5432 for example).
#
# Explanation taken from https://stackoverflow.com/a/54116964/3900435.

.test-template:
  extends:
    - .neutral-orgrunner
  stage: test
  rules:
    # Always run except on schedules
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

###
# -- Security and compliance jobs
#

include:
  - local: .gitlab/ci/security/security.gitlab-ci.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        when: always
      - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        when: always
      - when: never

#
###

###
# -- Automated testing
.install-testing:
  image: public.ecr.aws/docker/library/python:3.11
  before_script:
    # Add timestamp to logs for debugging problem with containers dying
    - echo "UTC Timestamp"
    - date '+%Y-%m-%dT%H:%M:%S:%3NZ'
    - python -m venv .venv
    - source .venv/bin/activate
    - echo -e "machine gitlab.com\nlogin gitlab-ci-token\npassword ${CI_JOB_TOKEN}" > ~/.netrc
    - pip install --extra-index-url https://gitlab.com/api/v4/projects/48897778/packages/pypi/simple -U pip setuptools -e '.[testing]'

.pytest-template:
  extends:
    - .test-template
    - .install-testing
  needs: []

# Unit tests
pytest_unit:
  extends:
    - .pytest-template
    - .test-template
    - .neutral-orgrunner
  variables:
    OTEL_SDK_DISABLED: "true"
  script:
    - make unit-test
  image: $IMAGE
  artifacts:
    when: always
    paths:
      - build/report/coverage*
    reports:
      junit: build/report/pytest_junit.xml
  parallel:
    matrix:
      - IMAGE:
          - public.ecr.aws/docker/library/python:3.11

# Tests against actual running MongoDB and PostgreSQL instances
pytest_integration:
  extends:
    - .pytest-template
    - .test-template
    - .neutral-orgrunner
  variables:
    # Gitlab Pipeline behavior
    CI_DEBUG_TRACE: "false"
    DEVICE_VERIFICATION_URI: http://localhost:4200/activate
    # PostgreSQL config
    SQL_SCHEME: postgresql+asyncpg
    SQL_HOST: localhost
    SQL_PORT: 5432
    SQL_USERNAME: root
    SQL_PASSWORD: toor
    SQL_DBNAME: basecamp
    # Variables used by Gitlab CI Services for PostgreSQL
    POSTGRES_DB: $SQL_DBNAME
    POSTGRES_USER: $SQL_USERNAME
    POSTGRES_PASSWORD: $SQL_PASSWORD
    POSTGRES_HOST_AUTH_METHOD: trust
    # AWS Localstack variables
    AWS_ACCESS_KEY_ID: dummy
    AWS_SECRET_ACCESS_KEY: dummy
    AWS_DEFAULT_REGION: us-east-1
    AWS_ENDPOINT: http://localhost:4566
    ATTACHMENTS_BUCKET: exchange-attachments
    SUBSCRIPTION_SERVICE_URL: exchange-subscription
    EXPORT_BUCKET: exchange-exports
    OTEL_SDK_DISABLED: "true"
  script:
    - pip install awscli
    - chmod +x localSetup.sh
    - ./localSetup.sh
    - pip install docutils==0.18 # awscli downgrate this package version
    - make integration-test
  image: public.ecr.aws/docker/library/python:3.11
  artifacts:
    when: always
    paths:
      - build/report/coverage*
    reports:
      junit: build/report/pytest_junit.xml
  services:
    - public.ecr.aws/docker/library/postgres:13.2
    - public.ecr.aws/localstack/localstack:1.4.0

# Tests our HTTP endpoint against a running instance of the app
pytest_functional_http:
  extends:
    - .pytest-template
    - .neutral-orgrunner
    - .large-template
  variables:
    NAME: "admin"
    # AWS Localstack variables
    AWS_ACCESS_KEY_ID: dummy
    AWS_SECRET_ACCESS_KEY: dummy
    AWS_DEFAULT_REGION: us-east-1
    AWS_ENDPOINT: http://localhost:4566
    ATTACHMENTS_BUCKET: exchange-attachments
    EXPORT_BUCKET: exchange-exports
    MESSAGE_BACKUPS_BUCKET: backups_bucket
    ACTIVITY_LOGS_BUCKET: exchange-activity-logs
    MEASUREMENT_URL: http://localhost:3000
    WORKFLOW_URL: http://localhost:3000
    ATTACHMENT_URL: http://localhost
    SUBSCRIPTION_SERVICE_URL: http://localhost
    PERMISSION_URL: http://localhost
    LIVE_API_HOST: localhost
    LIVE_API_URL: http://$LIVE_API_HOST
    # Gitlab Pipeline behavior
    CI_DEBUG_TRACE: "false"
    # Application and test configuration
    GCIP_TENANT_NAME: yeetenant
    GCIP_FIREBASE_API_KEY: foo
    ROUTERS: '["workspace", "notification", "user", "collaborator", "device", "permission", "attachment", "properties", "comment", "export", "auth", "inventory", "healthz"]'
    CORS_ORIGINS: '["*"]'
    CORS_METHODS: '["*"]'
    CORS_HEADERS: '["*","authorization"]'
    CORS_EXPOSE_HEADERS: '["*"]'
    LOG_LEVEL: debug
    DEVICE_VERIFICATION_URI: http://localhost:4200/activate
    # PostgreSQL config
    SQL_SCHEME: postgresql+asyncpg
    SQL_HOST: localhost
    SQL_PORT: 5432
    SQL_USERNAME: root
    SQL_PASSWORD: toor
    SQL_DBNAME: basecamp
    # Variables used by Gitlab CI Services for PostgreSQL
    POSTGRES_DB: $SQL_DBNAME
    POSTGRES_USER: $SQL_USERNAME
    POSTGRES_PASSWORD: $SQL_PASSWORD
    POSTGRES_HOST_AUTH_METHOD: trust
    # Sendgrid config
    SENDGRID_API_KEY: "fooapikey"
    SENDGRID_INVITATION_TEMPLATE_ID: "footemplateid"
    SENDGRID_JOB_STATUS_UPDATE_TEMPLATE_ID: "feetemplateid"
    SENDGRID_NOREPLY_EMAIL: "foo@fou.com"
    EXCHANGE_WEB_URL: https://exchange.net
    IS_LOCAL: true
    OTEL_SDK_DISABLED: "true"
  script:
    - pip install awscli
    - chmod +x localSetup.sh
    - ./localSetup.sh
    - pip install docutils==0.18 # awscli downgrate this package version
    - make migrate-db
    - make functional-test-http
  image: public.ecr.aws/docker/library/python:3.11
  artifacts:
