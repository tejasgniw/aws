# Various SQA reports
coverage:
  extends:
    - .neutral-orgrunner
  stage: report
  script:
    - pip install -U pip setuptools coverage
    - coverage report
    - coverage html
    - coverage xml
  image: public.ecr.aws/docker/library/python:3.11
  artifacts:
    when: always
    paths:
      - build/report/coverage
    reports:
      junit: build/report/*.xml
  needs:
    - pytest_unit
    - pytest_integration
    - pytest_functional_http
    - pytest_functional_consumers
  coverage: '/TOTAL +\d+ +\d+ +\d+ +\d+ +(\d+)%/'
  rules:
    # Only on branches and never on schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: on_success

