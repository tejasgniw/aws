##
# Exchange/Platform jobs
##

.container:release:ecr:platform:
  stage: release
  image:
    name: registry.gitlab.com/org/products/tandm/basecamp/oci/py_terraform
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}-${STACK}
  script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - aws ecr get-login-password --region $REPO_REGION | crane auth login -u AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$REPO_REGION.amazonaws.com
    - SRC_NAME="${SOURCE_IMAGE_NAME:-${IMAGE_NAME}}"
    - DST_NAME="${TARGET_IMAGE_NAME:-${SRC_NAME}}"
    - crane cp $CI_REGISTRY_IMAGE/${SRC_NAME}:${STACK}-${CI_COMMIT_SHA} ${ACCOUNT_ID}.dkr.ecr.${REPO_REGION}.amazonaws.com/${DST_NAME}:${IMAGE_TAG}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  allow_failure: true

container:build:typescript:services:
  extends:
    - .container-creds
  variables:
    CONTAINERNAME: typescript-services
  script:
    - export VERSION="$(cat VERSION | xargs)"
    - >
      /kaniko/executor \
        --destination $CI_REGISTRY_IMAGE/$CONTAINERNAME:qa-$CI_COMMIT_SHA \
        --destination $CI_REGISTRY_IMAGE/$CONTAINERNAME:prod-$CI_COMMIT_SHA \
        --destination $CI_REGISTRY_IMAGE/$CONTAINERNAME:qa-latest \
        --destination $CI_REGISTRY_IMAGE/$CONTAINERNAME:prod-latest \
        --context $CI_PROJECT_DIR \
        --build-arg VERSION=$VERSION \
        --dockerfile $CI_PROJECT_DIR/container/$CONTAINERNAME/Dockerfile \
        --snapshotMode=redo
  rules:
    # Only run after a merge on default branch
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: on_success
  needs:
    - build_admin_dist_package
    - build_admin_requirements
    - build_legacy_dist
  dependencies:
    - build_admin_dist_package
    - build_legacy_dist

container:release:platform:ecr:qa:
  extends: .container:release:ecr:platform
  variables:
    STACK: qa
    REPO_REGION: us-east-1
    ACCOUNT_ID: "091838682574"
    AWS_ACCESS_KEY_ID: "$AWS_CLoudOps_SAAS_development_AccessKey"
    AWS_SECRET_ACCESS_KEY: "$AWS_CLoudOps_SAAS_development_SecretKey"
  needs: [container:build:typescript:services, container:build:python:services:qa]
  allow_failure: true
  parallel:
    matrix:
      - SOURCE_IMAGE_NAME: typescript-services
        TARGET_IMAGE_NAME: services-platform
      - SOURCE_IMAGE_NAME: python-services
        TARGET_IMAGE_NAME: admin-webapp

container:release:platform:ecr:prod:
  extends: .container:release:ecr:platform
  variables:
    STACK: prod
    REPO_REGION: eu-central-1
    ACCOUNT_ID: "180367240542"
    AWS_ACCESS_KEY_ID: "$AWS_CLoudOps_SAAS_production_AccessKey"
    AWS_SECRET_ACCESS_KEY: "$AWS_CLoudOps_SAAS_production_SecretKey"
  needs:
