    GOOGLE_APPLICATION_CREDENTIALS_CONTENT: $VAR_GOOGLE_APPLICATION_CREDENTIALS_DEPLOYBOT_DEVELOPMENT
    GOOGLE_APPLICATION_CREDENTIALS: gcp_secret.json
    # Pulumi
    #   We don't end-to-end encrypt secrets. We could at some point.
    PULUMI_CONFIG_PASSPHRASE: ""
    PULUMI_STACK_NAME: CHANGE ME IN CI/CD
    PULUMI_BACKEND_URL: s3://org-cloudops-terraform-state-saas-qa/pulumi
    # Application and test configuration
    #  These are both read by Pulumi in src/basecamp/infra/resource/config.py
    #  and pytest in test/conftest.py
    AWS_DEFAULT_REGION: us-east-1
    GCIP_PROJECT_ID: orgapis-mr # We run MR pipelines with a specific project
    GCIP_REGION: northamerica-northeast1 # Default region where Cloud Functions will be deployed
    GOOGLE_PROJECT: orgapis-mr
    SQL_SCHEME: postgresql+asyncpg
    SQL_USERNAME: adminservices_write
    SQL_PASSWORD: $Database_adminservices_write_QA
    SQL_HOST: $ADMIN_DB_HOST_QA
    SQL_PORT: 5432
    SQL_DBNAME: adminservices
    SQL_SCHEMA: mr${CI_MERGE_REQUEST_IID}
    ###
    # Parameters for SQL migrations with "The Tool"
    TOOL_MIGRATION_POSTGRES_SCHEME: $SQL_SCHEME
    TOOL_MIGRATION_POSTGRES_USERNAME: $SQL_USERNAME
    TOOL_MIGRATION_POSTGRES_PASSWORD: $Database_adminservices_write_QA
    TOOL_MIGRATION_POSTGRES_HOST: $SQL_HOST
    TOOL_MIGRATION_POSTGRES_PORT: $SQL_PORT
    TOOL_MIGRATION_POSTGRES_DBNAME: $SQL_DBNAME
    TOOL_MIGRATION_POSTGRES_SCHEMA: mr${CI_MERGE_REQUEST_IID}
  extends:
    - .test-template
    - .infrastructure-deploy
    - .qa-orgrunner
  environment:
    name: deployment/$CI_COMMIT_REF_SLUG
    action: stop
  script:
    # Clean up that mess, but do not fail doing so.
    - tool -vv clean schema
    - pulumi stack ls
    - pulumi stack select $PULUMI_STACK_NAME
    - pulumi refresh --yes
    - pulumi destroy --yes || echo "Destroy failed"
    - pulumi stack rm $PULUMI_STACK_NAME --yes || echo "Stack could not be removed"
  rules:
    # Run either (optionally) manually on a MR pipeline or triggered by on_stop.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: manual
      allow_failure: true
    - when: on_success
      allow_failure: true
  needs: []

# Check for typing inconsistencies
typing:
  extends:
    - .codeanalysis-template
    - .test-template
  script:
    - make typing
  artifacts:
    when: always
    reports:
      junit: build/report/mypy_junit.xml
  cache:
    # Caching mypy files will help reduce the typing analysis time.
    # Cache is reused on a specific branch at a time.
    #   - Reference: https://docs.gitlab.com/ee/ci/caching/#share-caches-between-jobs-in-the-same-branch
    #   - Cache vs artifacts: https://gitlab.com/gitlab-org/gitlab-runner/-/issues/1232
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .mypy_cache
    when: on_success

