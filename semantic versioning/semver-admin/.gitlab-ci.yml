##############################################################################
# == CI/CD Pipeline ==========================================================
# region preamble
#####
#
# This files describe the lifecycle pipeline of our applications.
#
# Overview
#   https://docs.gitlab.com/ee/ci/README.html
#
# Keyword reference
#   https://docs.gitlab.com/ee/ci/yaml/README.html
#
# Predefined variables reference:
#   https://docs.gitlab.com/ee/ci/variables/predefined_variables.html
#
# Environments
#   https://docs.gitlab.com/ee/ci/environments/
#
###

###
# -- Global configurations
#
#

variables:
  APP_VERSION: 0.1.0
  SECURITY_SCAN_COMPONENT_GROUP: "Exchange"

stages:
  - janitor
  - freeze
  - build
  - publish
  - test
  - report
  - release
  - semver-release
  - notification
  - post-release

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      # Never run a 'branch' pipeline where this branch is under MRs.
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "$CI_DEFAULT_BRANCH"
      # Do run pipelines for schedules on the default branch
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      # Do run detached MR pipelines
      when: always
    - if: $CI_COMMIT_BRANCH
      # Do run manually triggered pipelines
      when: always

#
###

###
# -- Global templates
#
.large-template:
  variables:
    KUBERNETES_CPU_REQUEST: 1000m
    KUBERNETES_CPU_LIMIT: 1200m
    KUBERNETES_MEMORY_REQUEST: 2500Mi
    KUBERNETES_MEMORY_LIMIT: 2500Mi

# Setup python for tools
.pypackages-template:
  image: public.ecr.aws/docker/library/python:3.11
  before_script:
    # Add timestamp to logs for debugging problem with containers dying
    - echo "UTC Timestamp"
    - date '+%Y-%m-%dT%H:%M:%S:%3NZ'
    - python -m venv .venv
    - source .venv/bin/activate
    - echo -e "machine gitlab.com\nlogin gitlab-ci-token\npassword ${CI_JOB_TOKEN}" > ~/.netrc
    - pip install --extra-index-url https://gitlab.com/api/v4/projects/48897778/packages/pypi/simple -U pip==25.0.1 setuptools -e '.[build_system]'

.release-template:
  stage: release

# Pick our own Kubernetes runner
.neutral-orgrunner:
  tags:
    - vpc-neutral

.qa-orgrunner:
  tags:
    - vpc-qa

.prod-orgrunner:
  tags:
    - vpc-prod

.infra-pypackages-template:
  image: public.ecr.aws/docker/library/python:3.11
  before_script:
    # Add timestamp to logs for debugging problem with containers dying
    - echo "UTC Timestamp"
    - date '+%Y-%m-%dT%H:%M:%S:%3NZ'
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -U pip setuptools -e ./tool -e ./infra

.infrastructure-deploy:
  before_script:
    # Add timestamp to logs for debugging problem with containers dying
    - echo "UTC Timestamp"
    - date '+%Y-%m-%dT%H:%M:%S:%3NZ'
    # Read the version number
    - export VERSION="$(cat VERSION | xargs)"
    # Setup GCP service account key for deployement
    - echo "${GOOGLE_APPLICATION_CREDENTIALS_CONTENT}" > $GOOGLE_APPLICATION_CREDENTIALS
    # Make the creds path absolute
    - export GOOGLE_APPLICATION_CREDENTIALS="$(cd "$(dirname "$GOOGLE_APPLICATION_CREDENTIALS")"; pwd -P)/$(basename "$GOOGLE_APPLICATION_CREDENTIALS")"
    # Pulumi expects a virtual environment.  It could create it itself, but we
    # prefer to have more control and thus get better feedbacks in case something
    # goes wrong.
    - python -m venv .venv
    # Install the tool and Pulumi within the venv manually to only have to
    # activate it once. Otherwise, Pulumi require to reload it.
    - export VIRTUAL_ENV="$(pwd)/.venv"
    - ./.venv/bin/pip install -U pip setuptools -e ./tool -e ./infra
    - ./.venv/bin/tool -vv infra pulumi-install --home ./.venv
    - source .venv/bin/activate
    - curl -O https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-406.0.0-linux-x86_64.tar.gz
    - tar -xf google-cloud-cli-406.0.0-linux-x86_64.tar.gz
    - ./google-cloud-sdk/install.sh --quiet
    - ./google-cloud-sdk/bin/gcloud auth login --cred-file $GOOGLE_APPLICATION_CREDENTIALS
    - ./google-cloud-sdk/bin/gcloud config set project $GOOGLE_PROJECT
    - export GOOGLE_CLOUD_ACCESS_TOKEN="$(./google-cloud-sdk/bin/gcloud auth application-default print-access-token)"

.python-test-deploy:
  before_script:
    # Add timestamp to logs for debugging problem with containers dying
    - echo "UTC Timestamp"
    - date '+%Y-%m-%dT%H:%M:%S:%3NZ'
    # Setup GCP service account key for deployement
    - echo "${GOOGLE_APPLICATION_CREDENTIALS_CONTENT}" > $GOOGLE_APPLICATION_CREDENTIALS
    # Make the creds path absolute
    - export GOOGLE_APPLICATION_CREDENTIALS="$(cd "$(dirname "$GOOGLE_APPLICATION_CREDENTIALS")"; pwd -P)/$(basename "$GOOGLE_APPLICATION_CREDENTIALS")"
    # Pulumi expects a virtual environment.  It could create it itself, but we
    # prefer to have more control and thus better feedbacks in case something
    # goes wrong.
    - python -m venv .venv
    - source .venv/bin/activate
    # Install the tool and Pulumi within the venv.
    - pip install -U pip setuptools -e ./tool -e ./infra

.mongo-replica-set-init:
  before_script:
    - curl -fsSL https://pgp.mongodb.com/server-6.0.asc | gpg --dearmor | tee /usr/share/keyrings/mongodb-server-6.0.gpg > /dev/null
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-6.0.gpg] https://repo.mongodb.org/apt/debian bullseye/mongodb-org/6.0 main" | tee /etc/apt/sources.list.d/mongodb-org-6.0.list
    - apt-get update && apt-get install -y mongodb-mongosh
    - |
      until mongosh --host mongo --port 27017 --eval "db.adminCommand('ping')" >/dev/null 2>&1; do
        echo "Waiting for MongoDB...";
        sleep 2;
      done
    - echo "MongoDB is ready!"
    - |
      mongosh --host mongo --port 27017 --quiet --eval "
          try {
            rs.status()
          } catch (err) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'mongo:27017' }]
            })
          }
        "
    - echo "Replica set initialized!"
  services:
    - name: mongo:5.0.24
      alias: mongo
      command:
        ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]

#
###

#####
# endregion
##############################################################################

##############################################################################
# -- STAGE: clean the kitchen ------------------------------------------------
# region janitor
#####
#
# Reference: https://pyup.readthedocs.io/en/latest/
#
.fix-pulumi-stack:
  extends:
    - .test-template
  image: public.ecr.aws/docker/library/python:3.11
  when: manual
  before_script:
    # Setup tool and pulumi
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -U pip setuptools -e ./tool -e ./infra
    - tool -vv infra pulumi-install
    - pulumi version
    - pulumi login $PULUMI_BACKEND_URL
    - pulumi whoami -v
    # Run fix
    - pulumi stack select $PULUMI_STACK_NAME
    - pulumi stack export > stack.json
    - cat stack.json
    - python3 scripts/pulumi_state_file_fixer/fix_pulumi_state_file.py
    - pulumi stack import --file stack.json

#####
# endregion
##############################################################################

##############################################################################
# -- STAGE: freeze -----------------------------------------------------------
# region freeze
#####
#
# Freeze the code and dependencies and archive everything as artifacts
#
.freeze-template:
  extends:
    - .neutral-orgrunner
  stage: freeze
  needs: []
  rules:
    # Always run except on schedules
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# Must enter IMAGE_TAG manually. Example: V1.1
setup-dev-container-image-version:static-version:
  extends:
    - .neutral-orgrunner
  stage: janitor
  script:
    - echo "IMAGE_TAG = '$IMAGE_TAG'"
    - if [ -z $IMAGE_TAG ]; then
      echo "IMAGE_TAG env variable must be set. Set the value manually and re-run the job. Exiting...";
      exit 1;
      fi
    - touch tag.env
    - echo "IMAGE_TAG=${IMAGE_TAG}" > tag.env
  artifacts:
    name: "$CI_COMMIT_REF_NAME-dev-container-tag"
    paths:
      - tag.env
  when: manual

# Build dev-container image for each platform (amd64 and arm64)
# The images will be pushed to IMAGE_TAG-dev for amd64 and IMAGE_TAG-dev-arm64 for arm64
build-dev-container-image:static-version:
  stage: janitor
  needs:
    - setup-dev-container-image-version:static-version
  extends:
    - .large-template
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - export $(cat ./tag.env | xargs)
    - DESTINATION="$CI_REGISTRY_IMAGE/exchange-admin-env:$IMAGE_TAG-$TAG"
    - echo "DESTINATION = $DESTINATION"
    - cd container/dev-container
    - >
      /kaniko/executor --destination "$DESTINATION" \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "Dockerfile" \
        --snapshot-mode=redo \
        --custom-platform=$CUSTOMPLATFORM
  parallel:
    matrix:
      - ARCHTAG: neutral
        TAG: dev
        CUSTOMPLATFORM: linux/amd64
      - ARCHTAG: neutral-arm64
        TAG: dev-arm64
        CUSTOMPLATFORM: linux/arm64
  when: on_success
  tags:
    - vpc-${ARCHTAG}

build_admin_requirements:
  extends:
    - .neutral-orgrunner
    - .freeze-template
    - .pypackages-template
  script:
    - make requirements
  artifacts:
    name: "$CI_COMMIT_REF_NAME-requirements"
    paths:
      - requirements.txt
      - src/basecamp/gcp/requirements.txt

build_admin_dist_package:
  extends:
    - .neutral-orgrunner
    - .freeze-template
    - .pypackages-template
  script:
    - make sdist-tgz
  artifacts:
    name: "$CI_COMMIT_REF_NAME-sdist_tgz"
    paths:
      - dist/*.tar.gz

build_legacy_dist:
  image: public.ecr.aws/docker/library/node:20
  extends:
    - .neutral-orgrunner
    - .freeze-template
  variables:
    # Gitlab Pipeline behavior
    CI_DEBUG_TRACE: "false"
  script:
    - cd legacy
    - node --version
    - cp .npmrc.pipeline .npmrc
    - yarn install --frozen-lockfile
    - yarn build:prod
  artifacts:
    name: "$CI_COMMIT_REF_NAME-legacy_dist"
    paths:
      - legacy/dist
      - legacy/node_modules
#####
# endregion
##############################################################################

##############################################################################
# -- STAGE: build ------------------------------------------------------------
# region build
#####
#
# Build production and tooling distributions
#
.build-template:
  stage: build
  rules:
    # Always run except on schedules
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  extends:
    - .neutral-orgrunner

.buildpy-template:
  extends:
    - .pypackages-template
    - .build-template

# Generate dependency tree JSON in the same directory as requirements.txt (for security scans/ dependency scanning)
build_pip_dependency_tree:
  extends:
    - .buildpy-template
  needs:
    - build_admin_dist_package
    - build_admin_requirements
  dependencies:
    - build_admin_requirements
  script:
    - pip install -r requirements.txt
    - pip install pipdeptree
    - pipdeptree -e pipdeptree --json > pipdeptree.json
  artifacts:
    when: on_success
    paths:
      - pipdeptree.json

# GCIP Cloud Function archive
##FIXME install tool template and use it for gcip
gcip_zip:
  extends:
    - .infra-pypackages-template
    - .build-template
  script:
    - tool -vv build googlecloudbeforecreatefuncdist
  artifacts:
    name: "$CI_COMMIT_REF_NAME-gcip_zip"
    paths:
      - dist/*.zip

.openapi-base:
  image: public.ecr.aws/docker/library/node:20
  extends: .build-template
  before_script:
    - curl https://pyenv.run | bash
    - /root/.pyenv/bin/pyenv install 3.11.10
    - /root/.pyenv/versions/3.11.10/bin/python3.11 -m venv .venv
    - source .venv/bin/activate
    - echo -e "machine gitlab.com\nlogin gitlab-ci-token\npassword ${CI_JOB_TOKEN}" > ~/.netrc
    - pip install --extra-index-url https://gitlab.com/api/v4/projects/48897778/packages/pypi/simple -U -e .
  needs:
    - build_legacy_dist
  dependencies:
    - build_legacy_dist

# Publish our OpenAPIv3 spec

openapi:
  extends: .openapi-base
  script:
    - make openapi
  artifacts:
    name: "$CI_COMMIT_REF_NAME-openapi"
    paths:
      - build/openapi/openapi.yml

openapi_public:
  extends: .openapi-base
  variables:
    PUBLIC_OPENAPI_SPEC: true
  script:
    - make openapi-public
  artifacts:
    name: "$CI_COMMIT_REF_NAME-openapi"
    paths:
      - build/openapi/openapi_public.yml

###
# -- Jobs for building container images
.container-creds:
  extends:
    - .build-template
    - .neutral-orgrunner
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - userinfo="$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$userinfo\"}}}" > /kaniko/.docker/config.json
    - echo -e "machine gitlab.com\nlogin gitlab-ci-token\npassword ${CI_JOB_TOKEN}" > .netrc
    # Setup GCP service account key used by the Firebase Admin SDK
    # this is included in the docker image.
    - echo "${GOOGLE_APPLICATION_CREDENTIALS_ADMINSDK_CONTENT}" > ./adminsdk-credentials.json

# Build the application container
# build latest image for qa and prod stacks only
.container:build:
  extends:
    - .container-creds
  script:
    - export VERSION="$(cat VERSION | xargs)"
    - |
      if [ "$STACK" = "qa" ] || [ "$STACK" = "prod" ]; then
        export EXTRA_DEST="--destination $CI_REGISTRY_IMAGE/$CONTAINERNAME:$STACK-latest"
      else
        export EXTRA_DEST=""
      fi
    - >
      /kaniko/executor --destination $CI_REGISTRY_IMAGE/$CONTAINERNAME:$STACK-$CI_COMMIT_SHA $EXTRA_DEST \
        --context $CI_PROJECT_DIR \
        --build-arg VERSION=$VERSION \
        --dockerfile $CI_PROJECT_DIR/container/$CONTAINERNAME/Dockerfile \
        --snapshotMode=redo

container:build:python:services:mr:
  extends:
    - .container:build
    - .large-template
  variables:
    GOOGLE_APPLICATION_CREDENTIALS_ADMINSDK_CONTENT: $VAR_GOOGLE_APPLICATION_CREDENTIALS_ADMINSDK_MR
    STACK: $CI_MERGE_REQUEST_IID
    CONTAINERNAME: python-services
  rules:
    # Only on branches and never on schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: on_success
  needs:
    - build_admin_dist_package
    - build_admin_requirements
  dependencies:
    - build_admin_dist_package
    - build_admin_requirements

container:build:python:services:qa:
  extends:
    - .container:build
  variables:
    GOOGLE_APPLICATION_CREDENTIALS_ADMINSDK_CONTENT: $VAR_GOOGLE_APPLICATION_CREDENTIALS_ADMINSDK_DEVELOPMENT
    STACK: qa
    CONTAINERNAME: python-services
  rules:
    # Only run after a merge on default branch
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - when: on_success
  needs:
    - build_admin_dist_package
    - build_admin_requirements
  dependencies:
    - build_admin_dist_package
    - build_admin_requirements

container:build:python:services:prod:
  extends:
    - .container:build
  variables:
    GOOGLE_APPLICATION_CREDENTIALS_ADMINSDK_CONTENT: $VAR_GOOGLE_APPLICATION_CREDENTIALS_ADMINSDK_EXPLOITATION
    STACK: prod
    CONTAINERNAME: python-services
  rules:
    # Only run after a merge on default branch
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - when: on_success
  needs:
    - build_admin_dist_package
    - build_admin_requirements
  dependencies:
    - build_admin_dist_package
    - build_admin_requirements

#####
# endregion
